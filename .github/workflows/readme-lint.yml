name: readme-lint
on: [push, pull_request]
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # A pull request checkout does not include the version branch. The
      # linter looks for it before it reads any page.
      - name: Fetch version branch
        run: git fetch --depth=1 origin +refs/heads/v1.0:refs/remotes/origin/v1.0
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      # pinned so a CLI release cannot break CI silently
      - run: npx -y @readme/cli@0.2.0 lint
